<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>コイントスアプリ</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            background-color: #f0f0f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .coin-container {
            width: 200px;
            height: 200px;
            perspective: 1000px;
            margin: 50px auto;
            cursor: pointer;
            touch-action: none;
        }

        .coin {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.6s ease-out;
        }

        .coin-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: bold;
            color: #333;
            background: linear-gradient(45deg, #ffd700, #ffed4a);
            border: 8px solid #daa520;
            box-sizing: border-box;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
        }

        .coin-back {
            transform: rotateY(180deg);
        }

        #result {
            font-size: 2rem;
            margin-top: 20px;
            min-height: 3rem;
        }

        .instruction {
            color: #666;
            margin-top: 20px;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <h1>コイントスアプリ!</h1>
    <div class="coin-container">
        <div class="coin">
            <div class="coin-face coin-front">O</div>
            <div class="coin-face coin-back">X</div>
        </div>
    </div>
    <div id="result"></div>
    <div class="instruction">コインをスワイプしてトスしてください</div>

    <script src="./src/app.js"></script>
</body>
</html>
